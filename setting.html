<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SETTINGS - CLICKER TOP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>
        <span>S</span><span>E</span><span>T</span><span>T</span><span>I</span><span>N</span><span>G</span><span>S</span>
    </h1>

    <div class="settings-container">
        <!-- Option Volume -->
        <div class="setting-item">
            <label for="volume">VOLUME</label>
            <input type="range" id="volume" name="volume" min="0" max="100" value="80">
        </div>

        <!-- Option Langue -->
        <div class="setting-item">
            <label for="lang">LANGUE</label>
            <select id="lang">
                <option value="fr">FRANÇAIS</option>
                <option value="en">ENGLISH</option>
            </select>
        </div>

        <!-- Section Crédits -->
        <div class="credits-box">
            <h3>CRÉDITS</h3>
            <p>Merci à Arthur et Nathan ❤️</p>
        </div>

        <!-- Bouton retour -->
        <div class="menu-buttons">
            <a href="index.html" class="start-btn">RETOUR</a>
        </div>
    </div>

</body>
</html>
